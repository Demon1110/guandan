name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - '.github/workflows/desktop.yml'

jobs:
  package:
    name: 桌面壳 · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            bundle: exe
          - name: linux-x64
            runner: ubuntu-22.04
            bundle: appimage-deb
          - name: macos-arm64
            runner: macos-14
            bundle: dmg
          - name: macos-x64
            runner: macos-15-intel
            bundle: dmg
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: 安装 Linux WebKitGTK 依赖
        if: matrix.runner == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Windows 出 NSIS 包（CI 网络可达，走 tauri bundler）
        if: matrix.runner == 'windows-latest'
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles nsis

      - name: Linux 出 AppImage + deb
        if: matrix.runner == 'ubuntu-22.04'
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --bundles appimage,deb

      - name: macOS 出 dmg（有证书则签名/公证，无证书出未签名包）
        if: startsWith(matrix.runner, 'macos')
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --bundles dmg

      - name: 收集产物
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            find apps/desktop/src-tauri/target/release/bundle/nsis -type f -name '*.exe' -exec cp {} artifacts/ \;
          else
            find apps/desktop/src-tauri/target/release/bundle -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
              -exec cp {} artifacts/ \;
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: guandan-desktop-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
