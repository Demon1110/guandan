name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单元 + 集成（native）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: 安装 protoc（gf-protocol build.rs 依赖）
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy（warnings 视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试（含 L2/L3/L4 校验器与房间主干用例）
        run: cargo test --workspace

  dual-artifact:
    name: 双产物 stateHash 同解（native vs wasm）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: 安装 protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: M0 黄金双端比对（native vs wasm 8 字段 + 现行锚点）
        run: pwsh -NoProfile -File crates/engine/tests/wasm/verify_m0_golden.ps1
      - name: M1 房间 + AI-L2 bot 双产物同解（两局 stateHash 逐字节相等）
        run: pwsh -NoProfile -File scripts/verify_dual_hash.ps1
      - name: Web 端续局 gate（存档 → 丢弃实例 → 回放，哈希自证）
        run: node apps/client/test_restore.mjs
