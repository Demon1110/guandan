[package]
name = "guandan-desktop"
version = "0.1.0"
description = "掼蛋桌面壳（Tauri 2）"
edition = "2021"
rust-version = "1.77"

# 独立 workspace：桌面壳引 Tauri，不能并入根 workspace
# （否则 `--workspace` 的测试/覆盖率会把整条 Tauri 依赖树算进来）
[workspace]

[lib]
name = "guandan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
