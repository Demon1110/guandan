<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>掼蛋 · Phaser 版</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #08301f; font-family: system-ui, sans-serif; }
    #game-root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #boot-status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #cdeedd; font-size: 18px; z-index: 10;
    }
    #help {
      position: absolute; bottom: 8px; left: 12px; color: #7fb99a; font-size: 12px; pointer-events: none;
    }
    /* 左上角设置按钮 */
    #settings-btn {
      position: absolute; top: 12px; left: 12px; z-index: 20;
      width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
      background: rgba(15,45,58,.9); color: #ffe9a8; border: 1px solid #f0d9a0;
      font-size: 20px; line-height: 38px; text-align: center;
    }
    #settings-btn:hover { background: #1d6f57; }
    /* 遮罩弹框（开局 / 设置共用） */
    .overlay {
      position: absolute; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; background: rgba(6,24,18,.72);
    }
    .overlay.show { display: flex; }
    .panel {
      background: #123c44; border: 2px solid #f0d9a0; border-radius: 18px;
      padding: 28px 34px; min-width: 380px; color: #e9fff3;
      box-shadow: 0 18px 60px rgba(0,0,0,.55);
    }
    .panel h2 { margin: 0 0 6px; font-size: 26px; color: #ffd76a; text-align: center; }
    .panel .sub { margin: 0 0 20px; font-size: 13px; color: #9fd0c8; text-align: center; }
    .panel .row { margin: 14px 0; }
    .panel .row > label { display: block; font-size: 13px; color: #cfe6e8; margin-bottom: 7px; }
    .panel .choices { display: flex; gap: 8px; flex-wrap: wrap; }
    .panel button {
      background: #1d6f57; color: #fff; border: 1px solid #2f8f6a; border-radius: 8px;
      padding: 9px 18px; font-size: 14px; cursor: pointer;
    }
    .panel button:hover { background: #2b8a6c; }
    .panel button.sel { background: #b8860b; border-color: #ffd76a; color: #fff8e0; }
    .panel button.primary { background: #b8860b; border-color: #ffd76a; font-size: 16px; padding: 11px 28px; }
    .panel .actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; }
    .panel button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="boot-status">正在加载 wasm 与引擎…</div>
  <button id="settings-btn" title="设置" style="display:none">⚙</button>
  <div id="help">30 秒出牌倒计时（超时自动过牌）· 点牌/拖动选中 · 左上角 ⚙ 设置主题/手牌/牌面 · 三个 bot 自动接管</div>

  <!-- 开局弹框 -->
  <div id="start-overlay" class="overlay">
    <div class="panel">
      <h2>掼蛋 · 单机练习</h2>
      <p class="sub">选择开局方式，并设置 bot 难度</p>
      <p class="sub" id="save-note" style="margin-top:-12px;color:#ffd76a"></p>
      <div class="row">
        <label>开局方式</label>
        <div class="choices" id="start-mode">
          <button data-v="new" class="sel">新局</button>
          <button data-v="continue" id="continue-btn">继续上一局</button>
        </div>
      </div>
      <div class="row">
        <label>bot 难度</label>
        <div class="choices" id="start-bot">
          <button data-v="0">简单</button>
          <button data-v="1">普通</button>
          <button data-v="2" class="sel">困难</button>
        </div>
      </div>
      <div class="actions"><button id="start-go" class="primary">开始</button></div>
    </div>
  </div>

  <!-- 设置弹框 -->
  <div id="settings-overlay" class="overlay">
    <div class="panel">
      <h2>设置</h2>
      <p class="sub">主题、手牌方式与牌面大小</p>
      <div class="row">
        <label>主题</label>
        <div class="choices" id="set-theme">
          <button data-v="squabby">肥仔</button>
          <button data-v="defaults">默认</button>
        </div>
      </div>
      <div class="row">
        <label>手牌方式</label>
        <div class="choices" id="set-hand">
          <button data-v="cols">列（同点叠列）</button>
          <button data-v="fan">横（铺满）</button>
        </div>
      </div>
      <div class="row">
        <label>牌面大小</label>
        <div class="choices" id="set-size">
          <button data-v="0.8">小</button>
          <button data-v="1" class="sel">中</button>
          <button data-v="1.2">大</button>
        </div>
      </div>
      <div class="row">
        <label>还贡限时</label>
        <div class="choices" id="set-tribute">
          <button data-v="10">10 秒</button>
          <button data-v="15" class="sel">15 秒</button>
          <button data-v="20">20 秒</button>
          <button data-v="30">30 秒</button>
        </div>
      </div>
      <div class="actions">
        <button id="settings-cancel">取消</button>
        <button id="settings-close" class="primary">完成</button>
      </div>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
