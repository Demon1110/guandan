[package]
name = "gf-server"
version = "0.1.0"
edition = "2021"
description = "掼蛋联机服务端：axum + tokio，复用 gf-table-runtime 房间，protobuf over WebSocket"

# 根 workspace 成员（判题/覆盖率按 -p gf-server 单独跑，不影响引擎统计）：
# 同仓同锁，`cargo test --workspace` 会把这里一起编进来；只在独立发布时单独 build。
[lib]
name = "gf_server"
path = "src/lib.rs"

[[bin]]
name = "gf-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
futures-util = "0.3"
# 短信真实通道：阻塞客户端只在独立线程里用，绝不在 tokio 运行时里阻塞。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

gf-engine = { path = "../../crates/engine" }
gf-protocol = { path = "../../crates/protocol" }
gf-table-runtime = { path = "../../crates/table-runtime" }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
