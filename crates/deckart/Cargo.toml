[package]
name = "gf-deckart"
version = "0.1.0"
description = "掼蛋牌面主题工具包：分层合成 54 张牌面 SVG、主题素材包打包/解包"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
publish = false

# 已并入根 workspace（成员见仓库根 Cargo.toml）；
# 覆盖率口径里本 crate 被排除，见 scripts/coverage.ps1 与 docs/assets/m1-coverage-baseline.md。

[features]
default = ["pack-write"]
# 打包/签名（需要 RNG；wasm32-unknown-unknown 上 getrandom 不可用，客户端只读包）
pack-write = ["dep:rand"]
# SVG → PNG（resvg + tiny-skia，仅 CLI / 服务端预览；不要开进 wasm）
png = ["dep:resvg", "dep:tiny-skia", "dep:fontdb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 不要 default features：默认会拉 getrandom（wasm32 上编不过，我们只用显式 nonce）
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.10"
# 只做验签/从字节恢复密钥，不需要 rand_core 生成密钥
ed25519-dalek = { version = "2" }
rand = { version = "0.8", optional = true }
resvg = { version = "0.45", optional = true, default-features = false, features = ["text"] }
tiny-skia = { version = "0.11", optional = true, features = ["png-format"] }
# 与 resvg 共用的字体库：打开 `fs` 才能 load_system_fonts（文本层转 PNG 时找系统字体）
fontdb = { version = "0.23", optional = true, features = ["fs"] }

[[bin]]
name = "gfdeck"
path = "src/bin/gfdeck.rs"
required-features = ["pack-write"]
