[package]
name = "gf-replay-viewer"
version = "0.1.0"
edition = "2021"
description = "掼蛋离线回放器（M2）：读 §7.7 回放包，从种子重演全場并逐步比对 stateHash"

[[bin]]
name = "replay-viewer"
path = "src/main.rs"

[dependencies]
gf-engine = { path = "../../crates/engine" }
gf-table-runtime = { path = "../../crates/table-runtime" }
serde_json = "1"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
